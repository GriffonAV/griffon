name: "griffonav"
arch: "amd64"
platform: "linux"
version: "0.1.0"
section: "utils"
priority: "optional"
maintainer: "Alexis <votre@email.com>"
description: "GriffonAV - Multi-component security tool"

contents:

  # Le Daemon Core
  - src: ./target/release/griffonav-daemon
    dst: /usr/bin/griffonav-daemon

# Le Runner (Indispensable pour le plugin_manager !)
  - src: ./target/release/griffonav-daemon-runner
    dst: /usr/bin/griffonav-daemon-runner

# Le CLI
  - src: ./target/release/griffonav-cli
    dst: /usr/bin/griffonav-cli

# Le GUI (issu de tauri build)
  - src: ./target/release/griffonav-gui 
    dst: /usr/bin/griffonav-gui

# plugins
  - src: ./target/release/plugins/libplugin_test.so
    dst: /usr/lib/griffonav/plugins/libplugin_test.so
  - src: ./target/release/plugins/libplugin_test_2.so
    dst: /usr/lib/griffonav/plugins/libplugin_test_2.so

  # Le service Systemd pour le daemon
  - src: ./daemon/griffonav-daemon.service
    dst: /lib/systemd/system/griffonav-daemon.service

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh