name: "griffon"
arch: "amd64"
platform: "linux"
version: "0.1.0"
section: "utils"
priority: "optional"
maintainer: "Griffon contact.griffon@proton.me"
description: "Griffon is a modular, Rust-based security and toolbox platform for Linux users."

contents:

  # Le Daemon Core
  - src: ./target/release/griffon-daemon
    dst: /usr/bin/griffon-daemon
    file_info:
      mode: 0755

# Le Runner (Indispensable pour le plugin_manager !)
  - src: ./target/release/griffon-daemon-runner
    dst: /usr/bin/griffon-daemon-runner
    file_info:
      mode: 0755

# Le CLI
  - src: ./target/release/griffon-cli
    dst: /usr/bin/griffon-cli
    file_info:
      mode: 0755

# Le GUI (issu de tauri build)
  - src: ./target/release/griffon-gui 
    dst: /usr/bin/griffon-gui
    file_info:
      mode: 0755

  - src: griffon.desktop
    dst: /usr/share/applications/griffon.desktop
    file_info:
      mode: 0644

  - src: logo.png
    dst: /usr/share/icons/hicolor/256x256/apps/griffon.png
    file_info:
      mode: 0644

# plugins
  - src: ./target/release/libplugin_template.so
    dst: /usr/lib/griffon/plugins/libplugin_template.so
    file_info:
      mode: 0644

  - src: ./target/release/libgriffon_cleaner.so
    dst: /usr/lib/griffon/plugins/libgriffon_cleaner.so
    file_info:
      mode: 0644

   # Plugin configs
  - src: ./plugins/plugin_template/plugin_template.toml
    dst: /usr/lib/griffon/plugins/plugin_template.toml
    file_info:
      mode: 0644

- src: ./plugins/griffon_scanner/libgriffon_scanner.toml
    dst: /usr/lib/griffon/plugins/libgriffon_scanner.toml
    file_info:
      mode: 0644

  - src: "./bench/configs/light.json"
    dst: /etc/griffon/plugins/griffon_cleaner/light.json
    file_info:
      mode: 0644

  - src: "./bench/configs/medium.json"
    dst: /etc/griffon/plugins/griffon_cleaner/medium.json
    file_info:
      mode: 0644

  - src: "./bench/configs/stress.json"
    dst: /etc/griffon/plugins/griffon_cleaner/stress.json
    file_info:
      mode: 0644

  # Les config pour le daemon
  - src: ./daemon/griffon-daemon.service
    dst: /lib/systemd/system/griffon-daemon.service
    file_info:
      mode: 0644

  - src: ./daemon/config_griffon_daemon.json
    dst: /etc/griffon/config_griffon_daemon.json
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libwebkit2gtk-4.1-dev
      - libssl-dev
  rpm:
    depends:
      - webkit2gtk4.1-devel
      - openssl-devel

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
