name: "griffonav"
arch: "amd64"
platform: "linux"
version: "0.1.0"
section: "utils"
priority: "optional"
maintainer: "Alexis <votre@email.com>"
description: "GriffonAV - Multi-component security tool"

contents:
  # Le GUI (issu de tauri build)
  - src: ./target/release/app 
    dst: /usr/bin/griffonav-gui

  # Le Daemon Core
  - src: ./target/release/daemon_core  # Le nom réel du fichier produit par Cargo
    dst: /usr/bin/griffonav-daemon     # Le nom que tu veux donner à l'utilisateur final

#   # Le Runner (Indispensable pour le plugin_manager !)
#   - src: ./target/release/runner
#     dst: /usr/bin/griffonav-runner

#   # Le CLI
#   - src: ./target/release/cli
#     dst: /usr/bin/griffon

#   # Le service Systemd pour le daemon
#   - src: ./daemon/griffonav-daemon.service
#     dst: /lib/systemd/system/griffonav-daemon.service

# scripts:
#   postinstall: ./scripts/postinstall.sh
#   preremove: ./scripts/preremove.sh