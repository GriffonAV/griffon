[package]
name = "plugin-installer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "griffon-plugin-installer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = "8.6.0"
uuid = { version = "1.23.5", features = ["v4"] }
toml = "1.1.3+spec-1.1.0"