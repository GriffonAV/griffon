[package]
name = "plugin-installer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "griffon-plugin-installer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
zip = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }

[package.metadata.release]
release = false
