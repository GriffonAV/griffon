[package]
name = "griffon-gui"
version.workspace = true
description = "The official GUI for Griffon"
authors = ["Griffon"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
logger = { workspace = true }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
ipc_protocol = { workspace = true }
tauri-plugin-opener = "2"
toml = { workspace = true }
tauri-plugin-dialog = "2"
zip = { workspace = true }
uuid = { workspace = true }
