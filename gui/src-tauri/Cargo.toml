[package]
name = "griffon-gui"
version.workspace = true
description = "The official GUI for Griffon"
authors = ["Griffon"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
logger = { workspace = true }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
ipc_protocol = { workspace = true }
tauri-plugin-opener = "2"
toml = "1.0.6"
tauri-plugin-dialog = "2"
zip = "4.2.0"
uuid = { version = "1.23.4", features = ["v4"] }

[package.metadata.release]
pre-release-replacements = [
  { file = "../../nfpm.yaml", search = 'version: "[0-9a-z\.-]+"', replace = 'version: "{{version}}"' },
  { file = "../../scripts/build-packages.sh", search = 'griffon-[0-9a-z\.-]+\.deb', replace = 'griffon-{{version}}.deb' },
  { file = "../../scripts/build-packages.sh", search = 'griffon-[0-9a-z\.-]+\.rpm', replace = 'griffon-{{version}}.rpm' },
]
