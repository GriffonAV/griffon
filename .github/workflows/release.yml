name: Griffon Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base can check ancestry against main
          fetch-depth: 0

      - name: Extract Version & Verify Branch
        id: get_version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Strip leading 'v' if present
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building for version: $VERSION (tag: $TAG)"

          # Check if the tagged commit is on main
          echo "Checking if commit $CURRENT_SHA is on main..."
          git fetch origin main
          if ! git merge-base --is-ancestor "$CURRENT_SHA" origin/main; then
            echo "❌ Error: Tags can only be released from the 'main' branch!"
            exit 1
          fi
          echo "✅ Verified: Tag is on the main branch."

  ci:
    name: CI
    needs: [verify]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  # CI only checks advisories on PRs that touch dependencies, so a release
  # always runs the full check
  audit:
    name: Dependency Audit (full)
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Builds the packages and checks they install on clean systems
  package:
    name: Packaging
    needs: [verify]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    permissions:
      contents: read

  release:
    name: Publish Release
    needs: [verify, ci, audit, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: List built artifacts
        run: ls -la dist/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          # The changelog is appended after this body
          body: |
            ## Installation

            Supported: Ubuntu 22.04+, Debian 12+, Fedora 36+ (x86_64).

            ```bash
            # Debian / Ubuntu
            sudo apt update && sudo apt install ./griffon-${{ needs.verify.outputs.version }}.deb

            # Fedora
            sudo dnf install ./griffon-${{ needs.verify.outputs.version }}.rpm
            ```

            **Then log out and back in** (or run `newgrp griffon`): the install adds your user to the `griffon` group, which the GUI and CLI need to talk to the daemon.

            Check: `systemctl status griffon-daemon` should say *active (running)*. Full guide and troubleshooting: [README](https://github.com/GriffonAV/griffon#installation).
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds the documentation website (griffon-doc on Vercel), which reads
      # the release list from GitHub at build time. Skipped if the secret is not set.
      - name: Update the documentation website
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
