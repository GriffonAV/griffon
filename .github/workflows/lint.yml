name: Griffon Lint

# Lints are fast feedback, so they run on every push to any branch. The rest
# of the pipeline (ci.yml) only runs on PRs and on develop/main.
on:
  push:
    branches:
      - "**"

  # Lets release.yml lint the tagged commit before publishing
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting & Lints
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        uses: clechasseur/rs-clippy-check@v3
        with:
          args: --workspace --all-targets --locked -- -D warnings

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
