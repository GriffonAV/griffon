name: Griffon Pipeline & Quality Checks (CI)

# Runs once per PR commit, and again after merging into develop/main. Feature
# branches get CI by opening a (draft) PR, or with "Run workflow".
on:
  push:
    branches:
      - "develop"
      - "main"

  pull_request:
    branches:
      - "develop"
      - "main"

  workflow_dispatch:

  # Lets release.yml run the full pipeline before publishing
  workflow_call:

# A new push to a PR cancels the outdated run for that PR. Pushes to
# develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # GTK/WebKit headers needed by the Tauri GUI crate (Build, Tests and
  # Formatting & Lints)
  APT_PACKAGES: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

jobs:
  quality:
    name: Formatting & Lints
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # The man-db trigger rebuilds the man page index after every install,
          # which is slow on GitHub runners and useless in CI
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # PRs reuse develop's cache without saving their own copy
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        uses: clechasseur/rs-clippy-check@v3
        with:
          args: --workspace --all-targets --locked -- -D warnings

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
       # - name: Check advisories
       #  continue-on-error: true
       #  uses: EmbarkStudios/cargo-deny-action@v2
       #  with:
       #    command: check advisories

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # The man-db trigger rebuilds the man page index after every install,
          # which is slow on GitHub runners and useless in CI
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # PRs reuse develop's cache without saving their own copy
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Build workspace
        id: build
        run: cargo build --workspace --exclude griffon-gui --locked

      - name: Build summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" == "success" ]; then
            STATUS="✅ Built"
          else
            STATUS="❌ Failed"
          fi
          echo "## 🔨 Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crate | Kind | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          cargo metadata --no-deps --format-version 1 \
            | jq -r --arg status "$STATUS" \
              '.packages[]
               | select(.name != "griffon-gui")
               | .targets[]
               | select(.kind[] | test("lib|bin|cdylib|rlib|dylib"))
               | "| \(.name) | \(.kind[0]) | \($status) |"' \
            | sort -u >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # The man-db trigger rebuilds the man page index after every install,
          # which is slow on GitHub runners and useless in CI
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # PRs reuse develop's cache without saving their own copy
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate test fixtures
        working-directory: plugins/griffon_scanner
        run: |
          python3 tests/fixtures/fetch_eicar.py
          python3 tests/fixtures/generate_fixtures.py

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        # Plugin contract tests run in their own job below
        run: cargo nextest run --workspace --profile ci --locked -E 'not binary_id(plugin_host::plugin_contract)'

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

  plugin-coverage:
    name: Cleaner & Nmap Coverage (70% each)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and LLVM tools
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
          components: llvm-tools-preview
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run isolated unit tests and check coverage
        run: bash scripts/plugin-coverage.sh
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f target/plugin-coverage/coverage.json ]; then
            python3 scripts/check-plugin-coverage.py target/plugin-coverage/coverage.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaner-nmap-coverage
          path: target/plugin-coverage/

  plugin-contract:
    name: Plugin Contract
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # PRs reuse develop's cache without saving their own copy
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Builds every plugin .so, loads it like griffon-daemon-runner does and
      # checks it against its manifest (see daemon/plugin_host/tests)
      - name: Run plugin contract tests
        run: cargo nextest run -p plugin_host --profile ci --locked -E 'binary_id(plugin_host::plugin_contract)'

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Plugin Contract Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build
      - name: Type-check and build
        run: npm run build
