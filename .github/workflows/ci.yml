name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # JOB 1: Fast feedback (Formatting & Lints)
  lints:
    name: Lints & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy (Linter)
        # We use -D warnings to BLOCK the merge if lints aren't fixed.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # JOB 2: Heavy Lifting (Tests & Coverage)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lints # Don't waste energy/time if lints fail
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run All Tests
        run: cargo test --workspace --all-features

  # JOB 3: Security Audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Cargo Audit
        uses: rustsec/audit-check-action@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}