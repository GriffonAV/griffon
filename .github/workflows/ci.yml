name: Griffon Pipeline & Quality Checks (CI)

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "develop"

  pull_request:
    branches:
      - "develop"
      - "main"

  # Lets release.yml run the full pipeline before publishing
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting & Lints
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        uses: clechasseur/rs-clippy-check@v3
        with:
          args: --workspace --all-targets --locked -- -D warnings

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build workspace
        id: build
        run: cargo build --workspace --exclude griffon-gui --locked

      - name: Build summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" == "success" ]; then
            STATUS="✅ Built"
          else
            STATUS="❌ Failed"
          fi
          echo "## 🔨 Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crate | Kind | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          cargo metadata --no-deps --format-version 1 \
            | jq -r --arg status "$STATUS" \
              '.packages[]
               | select(.name != "griffon-gui")
               | .targets[]
               | select(.kind[] | test("lib|bin|cdylib|rlib|dylib"))
               | "| \(.name) | \(.kind[0]) | \($status) |"' \
            | sort -u >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate test fixtures
        working-directory: plugins/griffon_scanner
        run: |
          python3 tests/fixtures/fetch_eicar.py
          python3 tests/fixtures/generate_fixtures.py

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        # Plugin contract tests run in their own job below
        run: cargo nextest run --workspace --profile ci --locked -E 'not binary_id(plugin_host::plugin_contract)'

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

  plugin-contract:
    name: Plugin Contract
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Builds every plugin .so, loads it like griffon-daemon-runner does and
      # checks it against its manifest (see daemon/plugin_host/tests)
      - name: Run plugin contract tests
        run: cargo nextest run -p plugin_host --profile ci --locked -E 'binary_id(plugin_host::plugin_contract)'

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Plugin Contract Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build
      - name: Type-check and build
        run: npm run build