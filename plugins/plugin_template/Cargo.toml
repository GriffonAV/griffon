[package]
name = "plugin_template"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin_sdk = { workspace = true }
# Required: abi_stable's proc macros (used by `export_plugin!`) hardcode `::abi_stable` paths.
abi_stable = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
lazy_static = "1.5.0"

[package.metadata.release]
release = false
