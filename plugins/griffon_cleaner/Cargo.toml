[package]
name = "griffon_cleaner"
version = "0.1.0"
edition = "2021"

[dependencies]
walkdir = "2.5.0"
thiserror = "2.0.17"
plugin_interface = { workspace = true }
abi_stable = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }