[package]
name = "plugin_scanner"
version = "0.1.0"
edition = "2024"
default-run = "plugin_scanner"


[[bin]]
name = "prepare"
path = "tools/prepare.rs"

[[bin]]
name = "plugin_scanner"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]

plugin_interface = { workspace = true }
abi_stable = "0.11.3"

anyhow = "1.0.100"
env_logger = "0.11.8"
log = "0.4.28"
rand = "0.10.1"
regex = "1.12.2"
yara-x = { git = "https://github.com/VirusTotal/yara-x" }
walkdir = "2"
reqwest = { version = "0.13.2", features = ["blocking"] }
zip = "8.5.1"
num_cpus = "1.17.0"
serde = "1.0.228"
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine_bench"
harness = false
