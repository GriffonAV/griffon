[package]
name = "griffon_scanner"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "bench_runner"
path = "src/bin/bench_runner.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin_sdk = { workspace = true }
abi_stable = { workspace = true }

anyhow = "1.0.100"
log = "0.4.28"
reqwest = { version = "0.13.2", features = ["blocking"] }
zip = "8.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }

yara-x = "1.15.0"
walkdir = "2"
sha2 = "0.11.0"
hex = "0.4.3"
clap = { version = "4.5.49", features = ["derive"] }
rayon = "1.12.0"
infer = "0.19.0"
dirs = "6.0.0"
toml = "1.1.2"
lazy_static = "1.5.0"

[package.metadata.release]
release = false
