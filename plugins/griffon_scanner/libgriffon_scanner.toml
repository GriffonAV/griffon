# Griffon Plugin Manifest: File Picker Demo
[plugin]
name = "Griffon Scanner"
id = "a75fcda4-4e8d-4988-b524-8bbd9ce09aeb"
version = "1.0.0"
author = "DiaboloAB"
description = "YARA & Hash Antivirus Scanner plugin for scanning, managing signatures and quarantine."
tabs = ["scan", "database", "quarantine"]
uuid = "a75fcda4-4e8d-4988-b524-8bbd9ce09aeb"


# =========================
# Store
# =========================

[store]

[store.data.database_status]
message = "status unknown"
error = ""
rules_count = 0

[store.data.database_update]
message = ""
error = ""

[store.default_settings]
folder = false
archive = true
threats = []
threads = 1
threading = "auto"
paths = ["/home/axis"]

[store.settings]
folder = false
archive = false
threats = []
threads = 1
threading = "auto"
paths = []

[store.data]
selected_threats = []
scan_result = []

[store.q_list]
threats = []

[store.q_result]
message = ""

# =========================
# UI
# =========================

[ui]

# =========================================================
# SCAN TAB
# =========================================================

[[ui.sections]]
id = "parameters"
tab = "scan"

[[ui.sections.contents]]
type = "row"
id = "scan_parameters_row"
gap = "lg"

[[ui.sections.contents.children]]
type = "column"
id = "threats_type_column"
gap = "md"

[[ui.sections.contents.children.children]]
type = "text"
id = "threats_type_title"
name = "Threats types"
variant = "subtitle"

[[ui.sections.contents.children.children]]
type = "checkbox"
id = "threat_ransomware"
label = "Ransomware"
checked = false
action = "scanner.set_threat_ransomware"

[[ui.sections.contents.children.children]]
type = "checkbox"
id = "threat_keylogger"
label = "Keylogger"
checked = false
action = "scanner.set_threat_keylogger"


[[ui.sections.contents.children]]
type = "column"
id = "scan_options_column"
gap = "md"

[[ui.sections.contents.children.children]]
type = "checkbox"
id = "archive"
label = "Include archived files"
checked = false
action = "scanner.set_archive"

[[ui.sections.contents.children.children]]
type = "checkbox"
id = "include_folders"
label = "recursive scan"
checked = false
action = "scanner.set_folder"


[[ui.sections.contents.children.children]]
type = "row"
id = "threads_row"
gap = "sm"
align = "center"


[[ui.sections.contents.children.children.children]]
type = "text"
id = "threads"
name = "thread number:"


[[ui.sections.contents.children.children.children]]
type = "select"
id = "threads_select"
options = [
    { "value" = "auto", "label" = "Auto" },
    { "value" = "max", "label" = "Max" },
    { "value" = "custom", "label" = "Custom" },
]
value = "auto"
action = "scanner.set_threading"


[[ui.sections.contents.children.children.children]]
type = "input"
id = "threads_input"
name = "Thread Number"
placeholder = "Enter thread number..."
input_type = "number"
action = "scanner.set_threads"


[[ui.sections]]
id = "scan"
tab = "scan"


[[ui.sections.contents]]
type = "row"
id = "scan_bt_row"
gap = "sm"


[[ui.sections.contents.children]]
type = "button"
id = "run_scan_bt"
name = "Run scan"
action = "scanner.run_scan"


[[ui.sections.contents.children]]
type = "button"
id = "run_default_scan_bt"
name = "Default scan (/home)"
action = "scanner.run_default_scan"


[[ui.sections]]
id = "results"
tab = "scan"


[[ui.sections.contents]]
type = "row"
id = "scan_results_row"
gap = "sm"


[[ui.sections.contents.children]]
type = "button"
id = "quarantine_bt"
confirmation = "Are you sure you want to quarantine the selected threats?"
name = "Quarantine Selected"
action = "scanner.quarantine_selected_threats"


[[ui.sections.contents.children]]
type = "button"
id = "delete_bt"
confirmation = "Are you sure you want to delete the selected threats? This action is irreversible."
name = "Delete Selected"
action = "scanner.delete_selected_threats"


# =========================================================
# DATABASE TAB
# =========================================================

[[ui.sections]]
id = "database_status"
tab = "database"


[[ui.sections.contents]]
type = "row"
id = "database_refresh_row"
gap = "sm"
justify = "flex-end"
align = "center"


[[ui.sections.contents.children]]
type = "button"
id = "database_refresh_bt"
name = "refresh"
action = "scanner.check_rules"


[[ui.sections.contents]]
type = "text"
id = "database_status_text"
name = "{{store.data.database_status.message}}"

[[ui.sections.contents]]
type = "text"
id = "database_error_text"
tone = "danger"
name = "{{store.data.database_status.error}}"

[[ui.sections.contents]]
type = "text"
id = "rules_count_text"
name = "{{store.data.database_status.rules_count}} rules loaded"


[[ui.sections]]
id = "database_update"
tab = "database"

[[ui.sections.contents]]
type = "row"
id = "database_update_row"
gap = "sm"
justify = "flex-end"
align = "center"

[[ui.sections.contents.children]]
type = "button"
id = "database_update_bt"
name = "update database"
action = "scanner.run_update"


[[ui.sections.contents.children]]
type = "button"
id = "database_force_update_bt"
name = "force update"
action = "scanner.force_update"


[[ui.sections.contents]]
type = "text"
id = "update_message_text"
name = "{{store.data.database_update.message}}"

[[ui.sections.contents]]
type = "text"
id = "update_error_text"
name = "{{store.data.database_update.error}}"

# =========================================================
# QUARANTINE TAB
# =========================================================

[[ui.sections]]
id = "quarantined_files"
tab = "quarantine"


[[ui.sections.contents]]
type = "row"
id = "quarantine_refresh_row"
gap = "sm"
justify = "flex-end"
align = "center"


[[ui.sections.contents.children]]
type = "button"
id = "quarantine_refresh_bt"
name = "refresh"
action = "scanner.q_list"


[[ui.sections.contents]]
type = "row"
id = "quarantine_actions_row"
gap = "sm"
justify = "flex-end"
align = "center"

[[ui.sections.contents.children]]
type = "button"
id = "quarantine_retore_bt"
name = "restore selected"
confirmation = "Are you sure you want to restore the selected threats?"
action = "scanner.q_restore"


[[ui.sections.contents.children]]
type = "button"
id = "quarantine_delete_bt"
name = "delete selected"
confirmation = "Are you sure you want to delete the selected threats? This action is irreversible."
action = "scanner.q_delete"


# =========================
# Scanner Settings Interactions
# =========================


[[interactions]]
id = "set_archive_scan"
on = "scanner.set_archive"


[[interactions.steps]]
type = "set"
key = "store.settings.archive"
from = "event.checked"


[[interactions]]
id = "set_folder"
on = "scanner.set_folder"


[[interactions.steps]]
type = "set"
key = "store.settings.folder"
from = "event.checked"


[[interactions]]
id = "set_threat_ransomware"
on = "scanner.set_threat_ransomware"

[[interactions.steps]]
type = "append_remove"
key = "store.settings.threats"
from = "event.checked"
value = "ransomware"


[[interactions]]
id = "set_threat_keylogger"
on = "scanner.set_threat_keylogger"

[[interactions.steps]]
type = "append_remove"
key = "store.settings.threats"
from = "event.checked"
value = "keylogger"


[[interactions]]
id = "set_threads"
on = "scanner.set_threads"

[[interactions.steps]]
type = "set"
key = "store.settings.threads"
from = "event.value"


[[interactions]]
id = "set_threading"
on = "scanner.set_threading"

[[interactions.steps]]
type = "set"
key = "store.settings.threading"
from = "event.value"


# =========================
# Scanner function Interactions
# =========================


[[interactions]]
id = "run_scan"
on = "scanner.run_scan"

[[interactions.steps]]
type = "execute_function"
key = "store.data.scan_result"
from = "store.settings"
fn = "scan"

[[interactions]]
id = "run_default_scan"
on = "scanner.run_default_scan"

[[interactions.steps]]
type = "execute_function"
key = "store.data.scan_result"
from = "store.default_settings"
fn = "scan"

# =========================
# Scanner result Interactions
# =========================


# =========================
# Quarantine function Interactions
# =========================

[[interactions]]
id = "quarantine_selected_threats"
on = "scanner.quarantine_selected_threats"

[[interactions.steps]]
type = "execute_function"
key = "store.data.quarantine_result"
from = "store.data.selected_threats"
fn = "quarantine_selected_threats"

[[interactions]]
id = "delete_selected_threats"
on = "scanner.delete_selected_threats"

[[interactions.steps]]
type = "execute_function"
key = "store.data.delete_result"
from = "store.data.selected_threats"
fn = "delete_selected_threats"

# =========================
# Database function Interactions
# =========================

[[interactions]]
id = "check_rules"
on = "scanner.check_rules"

[[interactions.steps]]
type = "execute_function"
key = "store.data.database_status"
returnType = "json"
fn = "db_state"

[[interactions]]
id = "run_update"
on = "scanner.run_update"

[[interactions.steps]]
type = "execute_function"
key = "store.data.database_status"
returnType = "json"
fn = "db_update"

[[interactions]]
id = "force_update"
on = "scanner.force_update"

[[interactions.steps]]
type = "execute_function"
key = "store.data.database_status"
returnType = "json"
fn = "db_update"

# =========================
# Quarantine function Interactions
# =========================

[[interactions.steps]]
type = "q_list"
on = "scanner.q_list"

[[interactions.steps]]
type = "execute_function"
key = "store.data.q_list"
returnType = "json"
fn = "q_list"

[[interactions.steps]]
type = "q_restore"
on = "scanner.q_restore"

[[interactions.steps]]
type = "execute_function"
key = "store.data.q_result"
returnType = "json"
fn = "q_restore"

[[interactions.steps]]
type = "q_delete"
on = "scanner.q_delete"

[[interactions.steps]]
type = "execute_function"
key = "store.data.q_result"
returnType = "json"
fn = "q_delete"
