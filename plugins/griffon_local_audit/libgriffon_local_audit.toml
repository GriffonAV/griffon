[plugin]
name = "Local Security Audit"
id = "6f7b1e8a-2fd5-4cab-9c72-69e0f0b43521"
version = "0.1.0"
author = "Griffon"
description = "Read-only Linux security posture audit with bounded local checks."
uuid = "6f7b1e8a-2fd5-4cab-9c72-69e0f0b43521"
tabs = ["overview", "inventory"]

[store.data.audit_request]
include_suid = true
max_findings = 250
profile = "standard"

[store.data.audit_result]
ok = false
status = "not_run"
profile = "standard"
scope = ""
message = "Run an audit to inspect this system."
duration_ms = 0
critical_count = 0
high_count = 0
medium_count = 0
low_count = 0
info_count = 0
truncated = false
diagnostics_summary = "Diagnostics will appear here after the audit."
findings = []
inventory = []
diagnostics = []
checks = []

[[ui.sections]]
id = "local_audit_overview"
tab = "overview"
title = "Local security audit"
description = "Read-only checks for accounts, host protections, runtime integrity, policy permissions, service exposure and privileged executables."

[[ui.sections.contents]]
type = "switch"
id = "audit_include_suid"
label = "Inventory privileged executables"
description = "Inspect SUID/SGID bits and Linux file capabilities in standard binary directories without following symbolic links."
checked = true
checked_from = "store.data.audit_request.include_suid"
action = "local_audit.set_include_suid"

[[ui.sections.contents]]
type = "select"
id = "audit_profile"
label = "Audit profile"
description = "Quick skips privileged-file inventory; deep also resolves best-effort port owners."
value = "standard"
value_from = "store.data.audit_request.profile"
action = "local_audit.set_profile"

[[ui.sections.contents.options]]
label = "Quick"
value = "quick"

[[ui.sections.contents.options]]
label = "Standard"
value = "standard"

[[ui.sections.contents.options]]
label = "Deep"
value = "deep"

[[ui.sections.contents]]
type = "local_audit_report"
id = "audit_report"
from = "store.data.audit_result"
plugin_uuid = "6f7b1e8a-2fd5-4cab-9c72-69e0f0b43521"

[[ui.sections.contents]]
type = "tab_navigation"
id = "audit_navigation"

[[ui.sections.contents.items]]
label = "Explore inventory"
description = "Review system protections, accounts, services, listening ports and privileged executables observed on this system."
target = "inventory"

[[ui.sections]]
id = "local_audit_inventory"
tab = "inventory"
title = "System inventory"
description = "Informational observations are listed separately and are not findings by themselves."

[[ui.sections.contents]]
type = "table"
id = "audit_inventory"
from = "store.data.audit_result.inventory"
selectable = false
searchable = true
filter_key = "category"
empty_message = "Run an audit to populate the system inventory."

[[ui.sections.contents.columns]]
key = "category"
label = "Category"
cell = "badge"
tone = "neutral"

[[ui.sections.contents.columns]]
key = "item"
label = "Item"
cell = "primary"

[[ui.sections.contents.columns]]
key = "details"
label = "Details"

[[interactions]]
id = "local_audit_set_include_suid"
on = "local_audit.set_include_suid"

[[interactions.steps]]
type = "set"
key = "store.data.audit_request.include_suid"
from = "event.checked"

[[interactions]]
id = "local_audit_set_profile"
on = "local_audit.set_profile"

[[interactions.steps]]
type = "set"
key = "store.data.audit_request.profile"
from = "event.value"

[[interactions]]
id = "local_audit_run"
on = "local_audit.run"

[[interactions.steps]]
type = "execute_function"
key = "store.data.audit_result"
from = "store.data.audit_request"
returnType = "json"
fn = "audit"
